<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lwandile Sovereign Terminal</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #e5e7eb; 
            font-family: 'Segoe UI', monospace; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header { 
            padding: 12px 24px; 
            background: #111827; 
            border-bottom: 1px solid #1f2937; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .title {
            font-size: 14px;
            letter-spacing: 1.5px;
            font-weight: bold;
            color: #10b981;
        }
        .status {
            font-size: 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            padding: 4px 10px;
            border-radius: 4px;
            color: #10b981;
        }
        #terminal-frame { 
            flex: 1; 
            width: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">LWANDILE ENGINEERING PROJECTS // SOVEREIGN ENGINE</div>
        <div class="status">● P2P SIGNAL ACTIVE</div>
    </div>
    <div id="terminal-frame"></div>

    <script>
        window.onload = () => {
            const domain = "meet.jit.si";
            const options = {
                // Unique room string so no outside party can accidentally join
                roomName: "LEP_Sovereign_Command_78923416", 
                width: "100%",
                height: "100%",
                parentNode: document.querySelector('#terminal-frame'),
                userInfo: {
                    displayName: 'S.W. Khuzwayo (Host)'
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: false,
                    disableThirdPartyRequests: true,
                    prejoinPageEnabled: false // Bypasses unnecessary waiting screens
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false,
                    TOOLBAR_BUTTONS: [
                        'microphone', 'camera', 'desktop', 'fullscreen',
                        'fittoscreen', 'chat', 'tileview'
                    ]
                }
            };
            const api = new JitsiMeetExternalAPI(domain, options);
        };
    </script>
</body>
</html>
